media:
  - name: blog_images
    label: Blog Images
    input: public/images/blog
    output: /images/blog
    extensions:
      - jpg
      - jpeg
      - png
      - webp

content:
  - name: blog
    label: Blog Posts
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: "{slug}.md"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: excerpt
        label: Excerpt
        type: text
      - name: category
        label: Category
        type: string
      - name: publishedAt
        label: Publication Date
        type: date
      - name: heroImage
        label: Featured Image
        type: image
        media: blog_images
      - name: body
        label: Content
        type: rich-text
        required: true